spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:booking_db}
    username: ${DB_USER:admin}
    password: ${DB_PASS:admin123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8082

catalog:
  service:
    uri: ${CATALOG_SERVICE_URI:http://localhost:8083}

auth:
  service:
    uri: ${AUTH_SERVICE_URI:http://localhost:8081}

app:
  openapi:
    server-url: ${OPENAPI_SERVER_URL:http://localhost:8080/api/bookings}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
