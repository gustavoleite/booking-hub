spring:
  datasource:
    url: jdbc:h2:mem:reviewtestdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  flyway:
    enabled: false
  rabbitmq:
    host: localhost
    port: 5672
  rabbitmq.listener.simple.auto-startup: false
