spring:
  cloud:
    gateway:
      globalcors:
        add-to-chain: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "${CORS_ALLOWED_ORIGINS:*}"
            allowedMethods: [ "GET", "POST", "PUT", "DELETE", "OPTIONS" ]
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service-route
          uri: ${AUTH_SERVICE_URI:http://auth-service:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/auth/(?<remaining>.*), /${remaining}

        - id: booking-service-docs-route
          uri: ${BOOKING_SERVICE_URI:http://booking-service:8082}
          predicates:
            - Path=/api/bookings/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        - id: review-service-docs-route
          uri: ${BOOKING_SERVICE_URI:http://booking-service:8082}
          predicates:
            - Path=/api/reviews/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        - id: booking-service-route
          uri: ${BOOKING_SERVICE_URI:http://booking-service:8082}
          predicates:
            - Path=/api/bookings/**
          filters:
            - JwtAuthFilter
            - RewritePath=/api/(?<remaining>.*), /${remaining}

        - id: catalog-service-route
          uri: ${CATALOG_SERVICE_URI:http://catalog-service:8083}
          predicates:
            - Path=/api/catalog/**
          filters:
            - JwtAuthFilter
            - RewritePath=/api/catalog/(?<remaining>.*), /${remaining}

        - id: review-service-route
          uri: ${BOOKING_SERVICE_URI:http://booking-service:8082}
          predicates:
            - Path=/api/reviews/**
          filters:
            - JwtAuthFilter
            - RewritePath=/api/(?<remaining>.*), /${remaining}


        - id: search-service-admin-route
          uri: ${SEARCH_SERVICE_URI:http://search-service:8085}
          predicates:
            - Path=/api/search/admin/**
          filters:
            - JwtAuthFilter
            - RewritePath=/api/search/(?<remaining>.*), /${remaining}

        - id: search-service-route
          uri: ${SEARCH_SERVICE_URI:http://search-service:8085}
          predicates:
            - Path=/api/search/**
          filters:
            - RewritePath=/api/search/(?<remaining>.*), /${remaining}

        # Feed público — o feedToken na URL é a autenticação, sem JWT
        - id: notification-feed-route
          uri: ${NOTIFICATION_SERVICE_URI:http://notification-service:8086}
          predicates:
            - Path=/api/calendar/feed/**
          filters:
            - RewritePath=/api/calendar/(?<remaining>.*), /${remaining}

        # Geração de token — requer JWT
        - id: notification-token-route
          uri: ${NOTIFICATION_SERVICE_URI:http://notification-service:8086}
          predicates:
            - Path=/api/calendar/**
          filters:
            - JwtAuthFilter
            - RewritePath=/api/calendar/(?<remaining>.*), /${remaining}
