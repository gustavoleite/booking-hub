spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:booking_db}
    username: ${DB_USER:admin}
    password: ${DB_PASS:admin123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBIT_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

catalog:
  service:
    uri: ${CATALOG_SERVICE_URI:http://catalog-service:8083}

auth:
  service:
    uri: ${AUTH_SERVICE_URI:http://auth-service:8081}

app:
  openapi:
    server-url: ${OPENAPI_SERVER_URL:http://localhost:8080/api/bookings}
