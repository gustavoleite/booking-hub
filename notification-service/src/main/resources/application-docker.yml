spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/${DB_NAME:notification_db}
    username: ${DB_USER:admin}
    password: ${DB_PASS:admin123}
  rabbitmq:
    host: ${RABBIT_HOST:rabbitmq}
    port: 5672
    username: guest
    password: guest
  mail:
    host: ${MAIL_HOST:mailhog}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

notification:
  base-url: ${NOTIFICATION_BASE_URL:http://localhost:8080/api/calendar}
