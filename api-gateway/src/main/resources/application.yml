spring:
  application:
    name: api-gateway
  profiles:
    active: ${spring.profiles.active:local}
server:
  port: ${GATEWAY_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, gateway
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
springdoc:
  enable-native-support: true
  show-actuator: true
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    configUrl: /v3/api-docs/swagger-config
    urls:
      - name: Auth Service
        url: /api/auth/v3/api-docs
      - name: Catalog Service
        url: /api/catalog/v3/api-docs
      - name: Booking Service
        url: /api/bookings/v3/api-docs
