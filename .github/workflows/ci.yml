name: CI — Booking Hub

on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:
    branches: ["main", "develop"]

env:
  JAVA_VERSION: "21"
  MAVEN_OPTS: "-Xmx2g -XX:+TieredCompilation -XX:TieredStopAtLevel=1"

jobs:

  # ============================================================
  # JOB 0 — DETECÇÃO INTELIGENTE DE MÓDULOS ALTERADOS
  # Produz a matrix dinâmica usada por todos os jobs seguintes.
  # Se apenas docs/infra mudaram, any-changed=false e o
  # pipeline para aqui sem consumir mais minutos de CI.
  # ============================================================
  detect-changes:
    name: "0. Detect Changed Modules"
    runs-on: ubuntu-latest
    outputs:
      matrix:      ${{ steps.build-matrix.outputs.matrix }}
      any-changed: ${{ steps.build-matrix.outputs.any-changed }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # necessário para diff correto em PRs

      - name: Detect changed paths per module
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway:
              - 'api-gateway/**'
            auth-service:
              - 'auth-service/**'
            catalog-service:
              - 'catalog-service/**'
            booking-service:
              - 'booking-service/**'
            search-service:
              - 'search-service/**'
            root:
              - 'pom.xml'
              - '.github/workflows/**'

      - name: Build dynamic module matrix
        id: build-matrix
        run: |
          MODULES=()

          # Mudança global (pom raiz ou workflow) → todos os módulos
          if [ "${{ steps.filter.outputs.root }}" == "true" ]; then
            MODULES=("api-gateway" "auth-service" "catalog-service" "booking-service" "search-service")
          else
            [ "${{ steps.filter.outputs.api-gateway }}"     == "true" ] && MODULES+=("api-gateway")
            [ "${{ steps.filter.outputs.auth-service }}"    == "true" ] && MODULES+=("auth-service")
            [ "${{ steps.filter.outputs.catalog-service }}" == "true" ] && MODULES+=("catalog-service")
            [ "${{ steps.filter.outputs.booking-service }}" == "true" ] && MODULES+=("booking-service")
            [ "${{ steps.filter.outputs.search-service }}"  == "true" ] && MODULES+=("search-service")
          fi

          if [ ${#MODULES[@]} -gt 0 ]; then
            JSON=$(printf '%s\n' "${MODULES[@]}" | jq -R . | jq -sc .)
            echo "matrix={\"module\":$JSON}" >> $GITHUB_OUTPUT
            echo "any-changed=true"          >> $GITHUB_OUTPUT
          else
            echo "matrix={\"module\":[]}"    >> $GITHUB_OUTPUT
            echo "any-changed=false"         >> $GITHUB_OUTPUT
          fi

  # ============================================================
  # JOB 1 — BUILD E COMPILAÇÃO
  # Roda em paralelo para cada módulo alterado
  # ============================================================
  build:
    name: "1. Build — ${{ matrix.module }}"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.any-changed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Compile ${{ matrix.module }}
        run: |
          mvn -B compile \
            -pl ${{ matrix.module }} -am \
            --no-transfer-progress

  # ============================================================
  # JOB 2 — ANÁLISE ESTÁTICA DE CÓDIGO (alínea b)
  # Código fora do padrão não chega aos testes
  # ============================================================
  static-analysis:
    name: "2. Static Analysis — ${{ matrix.module }}"
    runs-on: ubuntu-latest
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.any-changed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Checkstyle — ${{ matrix.module }}
        run: |
          mvn -B checkstyle:check \
            -pl ${{ matrix.module }} \
            --no-transfer-progress

      - name: SpotBugs — ${{ matrix.module }}
        run: |
          mvn -B spotbugs:check \
            -pl ${{ matrix.module }} \
            --no-transfer-progress

      - name: Upload SpotBugs report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-${{ matrix.module }}
          path: "${{ matrix.module }}/target/spotbugsXml.xml"

  # ============================================================
  # JOB 3 — TESTES UNITÁRIOS + COBERTURA (alínea a)
  # Só roda se o código passou pela análise estática
  # ============================================================
  unit-tests:
    name: "3. Unit Tests — ${{ matrix.module }}"
    runs-on: ubuntu-latest
    needs: [detect-changes, static-analysis]
    if: needs.detect-changes.outputs.any-changed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run unit tests — ${{ matrix.module }}
        run: |
          mvn -B test \
            -pl ${{ matrix.module }} \
            -Dexcludes="**/*IT.java,**/CucumberTest.java,**/StepDefinitions.java,**/SpringIntegrationConfig.java" \
            --no-transfer-progress

      - name: Generate JaCoCo report — ${{ matrix.module }}
        run: |
          mvn -B jacoco:report \
            -pl ${{ matrix.module }} \
            --no-transfer-progress

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ matrix.module }}
          path: "${{ matrix.module }}/target/site/jacoco/"
          retention-days: 7

      - name: Enforce minimum coverage 80% — ${{ matrix.module }}
        run: |
          mvn -B jacoco:check@check \
            -pl ${{ matrix.module }} \
            --no-transfer-progress

  # ============================================================
  # JOB 4 — TESTES DE INTEGRAÇÃO E BDD (alíneas b e c)
  # Requer serviços de infraestrutura (PostgreSQL, RabbitMQ, ES)
  # ============================================================
  bdd-integration:
    name: "4. BDD & Integration — ${{ matrix.module }}"
    runs-on: ubuntu-latest
    needs: [detect-changes, unit-tests]
    if: needs.detect-changes.outputs.any-changed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_running"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 5

      elasticsearch:
        image: elasticsearch:8.13.0
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # auth-service usa Testcontainers internamente (sobe seu próprio PostgreSQL,
      # coexiste com o service postgres declarado acima sem conflito)
      - name: Run integration tests (*IT) — ${{ matrix.module }}
        run: |
          mvn -B test \
            -pl ${{ matrix.module }} \
            -Dtest="**/*IT" \
            -DfailIfNoTests=false \
            --no-transfer-progress
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: admin
          DB_PASS: admin123
          RABBIT_HOST: localhost
          ELASTICSEARCH_HOST: localhost
          ELASTICSEARCH_PORT: 9200

      - name: Run BDD tests (Cucumber) — ${{ matrix.module }}
        run: |
          mvn -B test \
            -pl ${{ matrix.module }} \
            -Dtest="**/CucumberTest" \
            -DfailIfNoTests=false \
            --no-transfer-progress
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: admin
          DB_PASS: admin123
          RABBIT_HOST: localhost
          ELASTICSEARCH_HOST: localhost
          ELASTICSEARCH_PORT: 9200

      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-${{ matrix.module }}
          path: "${{ matrix.module }}/target/cucumber-reports/"
          retention-days: 7

  # ============================================================
  # JOB 5 — DOCKER BUILD VALIDATION
  # Apenas PRs para main; só os módulos que mudaram
  # ============================================================
  docker-build-check:
    name: "5. Docker Build — ${{ matrix.module }}"
    runs-on: ubuntu-latest
    needs: [detect-changes, bdd-integration]
    if: |
      needs.detect-changes.outputs.any-changed == 'true' &&
      github.event_name == 'pull_request' &&
      github.base_ref == 'main'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image — ${{ matrix.module }}
        run: |
          docker build \
            -f ${{ matrix.module }}/Dockerfile \
            -t bookinghub/${{ matrix.module }}:ci-check \
            .
