server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-chain: true
        cors-configurations:
          '[/**]':
            allowedOrigins: "${CORS_ALLOWED_ORIGINS:*}"
            allowedMethods: [ "GET", "POST", "PUT", "DELETE", "OPTIONS" ]
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        # 1. Rota Pública do Auth Service
        - id: auth-service-route
          uri: ${AUTH_SERVICE_URI:http://auth-service:8081}
          predicates:
            - Path=/api/auth/**

        # 2. Rota Protegida do Booking Service
        - id: booking-service-route
          uri: ${BOOKING_SERVICE_URI:http://booking-service:8082}
          predicates:
            - Path=/api/bookings/**
          filters:
            - JwtAuthFilter

        # 3. Rota Mista do Catalog Service
        - id: catalog-service-route
          uri: ${CATALOG_SERVICE_URI:http://catalog-service:8083}
          predicates:
            - Path=/api/catalog/**
          filters:
            - JwtAuthFilter

        # 4. Review Service
        - id: review-service-route
          uri: ${REVIEW_SERVICE_URI:http://review-service:8084}
          predicates:
            - Path=/api/reviews/**
          filters:
            - JwtAuthFilter

        # 5. Search Service (Público)
        - id: search-service-route
          uri: ${SEARCH_SERVICE_URI:http://search-service:8085}
          predicates:
            - Path=/api/search/**

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, gateway
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
