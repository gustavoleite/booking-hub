spring:
  cloud:
    gateway:
      globalcors:
        add-to-chain: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "${CORS_ALLOWED_ORIGINS:*}"
            allowedMethods: [ "GET", "POST", "PUT", "DELETE", "OPTIONS" ]
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service-route
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/auth/(?<remaining>.*), /${remaining}

        - id: booking-service-docs-route
          uri: ${BOOKING_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/bookings/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        - id: review-service-docs-route
          uri: ${REVIEW_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/reviews/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        - id: booking-service-route
          uri: ${BOOKING_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/bookings/**
          filters:
            - JwtAuthFilter
            - RewritePath=/api/(?<remaining>.*), /${remaining}

        - id: catalog-service-route
          uri: ${CATALOG_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/catalog/**
          filters:
            - JwtAuthFilter
            - RewritePath=/api/catalog/(?<remaining>.*), /${remaining}

        - id: review-service-route
          uri: ${REVIEW_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/reviews/**
          filters:
            - JwtAuthFilter
            - RewritePath=/api/(?<remaining>.*), /${remaining}

        - id: search-service-route
          uri: ${SEARCH_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/search/**
          filters:
            - JwtAuthFilter
            - RewritePath=/api/search/(?<remaining>.*), /${remaining}
