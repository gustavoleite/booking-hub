spring:
  application:
    name: api-gateway
server:
  port: ${GATEWAY_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, gateway
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Auth Service
        url: /api/auth/v3/api-docs
      - name: Booking Service
        url: /api/bookings/v3/api-docs
      - name: Catalog Service
        url: /api/catalog/v3/api-docs
      - name: Review Service
        url: /api/reviews/v3/api-docs
      - name: Search Service
        url: /api/search/v3/api-docs
