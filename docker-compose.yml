services:
  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USER: admin
      DB_PASS: admin123
      RSA_PRIVATE_KEY_VALUE: ${RSA_PRIVATE_KEY_VALUE}
    depends_on:
      auth-db:
        condition: service_healthy
    ports:
      - "8081:8081"

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      RSA_PUBLIC_KEY: ${RSA_PUBLIC_KEY}
    depends_on:
      - auth-service
    ports:
      - "8080:8080"
