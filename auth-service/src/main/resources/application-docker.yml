spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:auth_db}
    username: ${DB_USER:admin}
    password: ${DB_PASS:admin123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

rsa:
  private:
    key-path: ${RSA_PRIVATE_KEY_PATH:file:/app/certs/private_key.pem}

app:
  openapi:
    server-url: ${OPENAPI_SERVER_URL:http://localhost:8080/api/auth}
