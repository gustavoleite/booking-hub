services:
  # ==========================================
  # 1. INFRAESTRUTURA
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: bw-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      # O Postgres executa tudo que estiver em /docker-entrypoint-initdb.d na 1ª vez
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - bw-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bw-rabbitmq
    ports:
      - "5672:5672"   # Porta da aplicação
      - "15672:15672" # Porta do painel web
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - bw-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ==========================================
  # 2. MICROSSERVIÇOS (Aplicações)
  # ==========================================
  api-gateway:
    build: 
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: bw-api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - AUTH_SERVICE_URI=http://auth-service:8081
      - CATALOG_SERVICE_URI=http://catalog-service:8083
      - RSA_PUBLIC_KEY_PATH=file:/app/certs/public_key.pem
    volumes:
      - ./infra/certs:/app/certs:ro # Read-only para as chaves
    networks:
      - bw-network
    depends_on:
      - auth-service
      - catalog-service

  auth-service:
    build: 
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: bw-auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=auth_db
      - DB_USER=admin
      - DB_PASS=admin123
      - RSA_PRIVATE_KEY_PATH=file:/app/certs/private_key.pem
    volumes:
      - ./infra/certs:/app/certs:ro
    networks:
      - bw-network
    depends_on:
      postgres:
        condition: service_healthy

  catalog-service:
    build: 
      context: .
      dockerfile: catalog-service/Dockerfile
    container_name: bw-catalog-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=catalog_db
      - DB_USER=admin
      - DB_PASS=admin123
      - RABBIT_HOST=rabbitmq
    networks:
      - bw-network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

# ==========================================
# 3. REDES E VOLUMES
# ==========================================
networks:
  bw-network:
    driver: bridge

volumes:
  pgdata:
